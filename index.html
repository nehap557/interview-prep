<html lang="en">
<head>

<title>Interview Prep Tracker</title>

<style>
html{color-scheme:light}body{margin:0}

/* Layout: sticky header with progress, tab bar, then collapsible checklists. Calm utilitarian tracker; teal marks done, amber/red mark difficulty. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface2:#eceff3; --line:#d9dee5;
  --fg:#16202a; --muted:#5b6876; --accent:#0f766e; --accent-soft:#d5efec; --on-accent:#ffffff;
  --easy:#2f7d3b; --med:#a15c07; --hard:#b4332b;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1317; --surface:#161d23; --surface2:#1e272f; --line:#2b3640;
  --fg:#e6ebf0; --muted:#97a4b1; --accent:#4fd1c0; --accent-soft:#17383a; --on-accent:#08201d;
  --easy:#6fcf7e; --med:#e5a34a; --hard:#ef7c72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1317; --surface:#161d23; --surface2:#1e272f; --line:#2b3640;
  --fg:#e6ebf0; --muted:#97a4b1; --accent:#4fd1c0; --accent-soft:#17383a; --on-accent:#08201d;
  --easy:#6fcf7e; --med:#e5a34a; --hard:#ef7c72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:860px;margin:0 auto}
header{padding:28px 0 8px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 4px;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.stat b{display:block;font:500 1.15rem var(--mono);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;margin-top:8px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav button{font:500 .9rem var(--sans);color:var(--muted);background:none;border:1px solid transparent;border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);background:var(--surface);border-color:var(--line)}
nav button:focus-visible,summary:focus-visible,input:focus-visible+.box,.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab{display:none;padding-top:18px}.tab.on{display:block}
h2{font-size:1.15rem;margin:26px 0 6px;font-weight:600}
p.note{color:var(--muted);margin:0 0 12px;max-width:66ch}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 10px}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .t{font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
summary .t::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details[open]>summary .t::before{transform:rotate(45deg)}
summary .c{font:500 .82rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
summary .bar{grid-column:1/-1;margin:2px 0 0}
.learn{padding:0 14px 6px;color:var(--muted);font-size:.88rem}
.learn b{color:var(--fg);font-weight:500}
ul.list{list-style:none;margin:0;padding:4px 0 8px}
li.row{border-top:1px solid var(--line)}
li.row label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:start;padding:9px 14px;cursor:pointer}
li.row:hover{background:var(--surface2)}
li.row input{position:absolute;opacity:0;pointer-events:none}
.box{width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;margin-top:2px;display:grid;place-items:center;background:var(--surface)}
input:checked+.box{background:var(--accent);border-color:var(--accent)}
input:checked+.box::after{content:"";width:5px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.txt{min-width:0}
.name{display:block;overflow-wrap:anywhere}
.hint{display:block;color:var(--muted);font-size:.84rem}
li.row.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.meta{display:flex;gap:10px;align-items:center;font-size:.8rem;white-space:nowrap}
.d{font:500 .75rem var(--mono);padding:1px 7px;border-radius:10px;border:1px solid currentColor}
.d.E{color:var(--easy)}.d.M{color:var(--med)}.d.H{color:var(--hard)}
.meta a{color:var(--accent);text-decoration:none;font-weight:500}
.meta a:hover{text-decoration:underline}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:12px 14px}
.phase h3{margin:0;font-size:1rem}
.phase .when{font:500 .8rem var(--mono);color:var(--accent)}
.phase ul.list{padding-top:6px}
.phase li.row{border-top:0}
.phase li.row label{padding:5px 0}
.phase li.row:hover{background:none}
.reset{margin-top:28px;font:500 .85rem var(--sans);background:none;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
#sync{color:var(--muted);font-size:.8rem;margin-top:10px}
@media (max-width:520px){
  .stats{gap:6px}.stat{padding:8px}.stat b{font-size:1rem}
  li.row label{grid-template-columns:auto minmax(0,1fr)}
  .meta{grid-column:2;margin-top:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">
<header>
  <h1>Interview Prep Tracker</h1>
  <p class="sub">NeetCode 150 and a system design curriculum, built for full-time recruiting. Tick things off as you finish them; progress is saved.</p>

    <div class="stat"><b id="s-all">0%</b><span>Overall</span><div class="bar"><i id="b-all"></i></div></div>
    <div class="stat"><b id="s-nc">0 / 150</b><span>NeetCode 150</span><div class="bar"><i id="b-nc"></i></div></div>
    <div class="stat"><b id="s-sd">0 / 0</b><span>System design</span><div class="bar"><i id="b-sd"></i></div></div>
  </div>
  <div id="sync"></div>
</header>

<nav role="tablist" id="tabs">
  <button role="tab" data-tab="plan" aria-selected="true">Roadmap</button>
  <button role="tab" data-tab="nc" aria-selected="false">NeetCode 150</button>
  <button role="tab" data-tab="sd" aria-selected="false">System design</button>
  <button role="tab" data-tab="skills" aria-selected="false">Interview skills</button>
</nav>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:28px">
  <button class="reset" id="export" type="button" style="margin-top:0">Export progress</button>
  <button class="reset" id="import" type="button" style="margin-top:0">Import progress</button>
  <button class="reset" id="reset" type="button" style="margin-top:0">Clear all progress</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</div>
</div>

  "Pick one language and stick with it for the whole prep cycle",
  "Learn Big-O, recursion, and basic data structures cold",
  "Finish NeetCode: Arrays & Hashing, Two Pointers, Sliding Window, Stack, Binary Search",
  "Start System design section 1 (Foundations); aim for 2 sessions per week"]],
 ["Phase 2","Jan 2027 - Feb 2027","Core data structures",[
  "Finish NeetCode: Linked List, Trees, Heap, Backtracking, Tries",
  "Finish System design sections 2 and 3 (storage, distributed systems theory)",
  "Redo any problem you could not solve alone"]],
 ["Phase 3","Mar 2027 - Apr 2027","Graphs and DP",[
  "Finish NeetCode: Graphs, Advanced Graphs, 1-D DP, 2-D DP",
  "Finish System design section 4 (building blocks)",
  "Start your first classic designs: URL shortener, rate limiter, key-value store"]],
 ["Phase 4","May 2027 - Jun 2027","Fill the gaps",[
  "Finish NeetCode: Greedy, Intervals, Math & Geometry, Bit Manipulation",
  "Work through the classic designs list at roughly one per week",
  "Do your first mock interviews, coding and system design"]],
 ["Phase 5","Jul 2027 - Aug 2027","Interview-ready",[
  "Redo the full NeetCode 150 in random order, timed",
  "Do company-tagged and mixed-topic problems you have not seen",
  "Finish behavioral stories and the recruiting logistics list",
  "Do weekly mocks until applications and interviews begin"]]
];

/* ---------- STATE ---------- */
var DONE = new Set();
var LS = "prep-done-v1";
var remote = { doc: null, timer: null, busy: false, dirty: false, first: true };

function lsLoad(){ try{ var a = JSON.parse(localStorage.getItem(LS) || "[]"); if(Array.isArray(a)) a.forEach(function(x){DONE.add(x)}); }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(Array.from(DONE))); }catch(e){} }

function queueRemote(){
  if(!remote.doc) return;
  remote.dirty = true;
  clearTimeout(remote.timer);
  remote.timer = setTimeout(flushRemote, 600);
}
async function flushRemote(){
  if(!remote.doc || remote.busy || !remote.dirty) return;
  remote.busy = true; remote.dirty = false;
  try{
    await remote.doc.set({ done: Array.from(DONE) });
    setSync("Saved to your account");
  }catch(e){
    setSync("Saved on this device only");
  }
  remote.busy = false;
  if(remote.dirty) flushRemote();
}
function setSync(t){ document.getElementById("sync").textContent = t; }

/* ---------- RENDER ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var SLUG_FIX = { "Pow(x, n)": "powx-n" };
function slug(name){
  if(SLUG_FIX[name]) return SLUG_FIX[name];
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function row(id, name, hint, diff){
  var meta = "";
  if(diff){
    meta = '<span class="meta"><span class="d '+diff+'" title="'+({E:"Easy",M:"Medium",H:"Hard"})[diff]+'">'+diff+'</span>'
      + '<a href="https://leetcode.com/problems/'+slug(name)+'/" target="_blank" rel="noopener">Open</a></span>';
  }
  return '<li class="row'+(DONE.has(id)?' done':'')+'"><label><input type="checkbox" data-id="'+id+'"'+(DONE.has(id)?' checked':'')+'>'
    + '<span class="box"></span><span class="txt"><span class="name">'+esc(name)+'</span>'
    + (hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</span>'+meta+'</label></li>';
}
function group(gid, title, learn, rowsHtml, open){
  return '<details data-group="'+gid+'"'+(open?' open':'')+'><summary><span class="t">'+esc(title)+'</span><span class="c"></span><span class="bar"><i></i></span></summary>'
    + (learn?'<div class="learn">'+esc(learn)+'</div>':'')+'<ul class="list">'+rowsHtml+'</ul></details>';
}

function buildNC(){
  var h = '<h2>NeetCode 150</h2><p class="note">Work top to bottom within each topic; the order is easiest to hardest in concept. Open takes you straight to that problem on LeetCode. E, M and H mark easy, medium and hard. The note under each name is the key idea, so try the problem before you read it.</p>';
  NC.forEach(function(sec, si){
    var rows = sec[2].map(function(p, pi){ return row("nc:"+si+":"+pi, p[0], p[2], p[1]); }).join("");
    h += group("nc:"+si, sec[0], sec[1], rows, si===0);
  });
  return h;
}
function buildList(prefix, data, intro, diffless){
  var h = intro;
  data.forEach(function(sec, si){
    var rows = sec[2].map(function(p, pi){ return row(prefix+":"+si+":"+pi, p[0], p[1]); }).join("");
    h += group(prefix+":"+si, sec[0], sec[1], rows, si===0);
  });
  return h;
}
function buildPlan(){
  var h = '<h2>How to use this</h2><p class="note">This is a 9-month plan that assumes full-time recruiting starts around August or September 2027. If your deadlines are earlier, keep the order and compress the phases. Aim for roughly 5 coding sessions and 2 system design sessions a week. Do not move to the next topic until you can solve the medium problems in the current one without hints. Learning the pattern matters more than the count.</p>';
  h += '<h2>Phases</h2>';
  PLAN.forEach(function(p, i){
    h += '<div class="phase"><h3>'+esc(p[0])+' &middot; '+esc(p[2])+'</h3><div class="when">'+esc(p[1])+'</div><ul class="list">'
      + p[3].map(function(t, j){ return row("plan:"+i+":"+j, t, "", ""); }).join("") + '</ul></div>';
  });
  h += '<h2>Rules of thumb</h2><p class="note">Spend 20 to 30 minutes on a new problem before looking at the idea. After solving, write the pattern in one sentence. Do two weekly reviews: one for problems you missed, one for patterns you keep forgetting. In system design, always start with requirements and numbers before drawing boxes, and always say what you are trading away.</p>';
  return h;
}

function mount(){
  document.getElementById("tab-plan").innerHTML = buildPlan();
  document.getElementById("tab-nc").innerHTML = buildNC();
  document.getElementById("tab-sd").innerHTML = buildList("sd", SD,
    '<h2>System design curriculum</h2><p class="note">Go in order through sections 1 to 4, then start the classic designs. For each design, spend 45 minutes drawing it yourself, then compare with a good write-up and note what you missed.</p>');
  document.getElementById("tab-skills").innerHTML = buildList("sk", SKILLS,
    '<h2>Interview skills</h2><p class="note">Solving problems alone is only part of the job. These items cover talking through your work, timing, behavioral questions, and the logistics of applying.</p>');
  refresh();
}

/* ---------- PROGRESS ---------- */
function pct(a,b){ return b ? Math.round(100*a/b) : 0; }
function refresh(){
  var tot = {nc:[0,0], sd:[0,0], all:[0,0]};
  document.querySelectorAll("input[data-id]").forEach(function(cb){
    var id = cb.getAttribute("data-id"), k = id.split(":")[0], isDone = DONE.has(id);
    cb.checked = isDone;
    cb.closest("li").classList.toggle("done", isDone);
    tot.all[1]++; if(isDone) tot.all[0]++;
    if(k==="nc"||k==="sd"){ tot[k][1]++; if(isDone) tot[k][0]++; }
  });
  document.querySelectorAll("details[data-group]").forEach(function(d){
    var boxes = d.querySelectorAll("input[data-id]"), n = 0;
    boxes.forEach(function(b){ if(b.checked) n++; });
    d.querySelector(".c").textContent = n+" / "+boxes.length;
    d.querySelector(".bar i").style.width = pct(n, boxes.length)+"%";
  });
  document.getElementById("s-all").textContent = pct(tot.all[0], tot.all[1])+"%";
  document.getElementById("b-all").style.width = pct(tot.all[0], tot.all[1])+"%";
  document.getElementById("s-nc").textContent = tot.nc[0]+" / "+tot.nc[1];
  document.getElementById("b-nc").style.width = pct(tot.nc[0], tot.nc[1])+"%";
  document.getElementById("s-sd").textContent = tot.sd[0]+" / "+tot.sd[1];
  document.getElementById("b-sd").style.width = pct(tot.sd[0], tot.sd[1])+"%";
}

document.addEventListener("change", function(e){
  var cb = e.target.closest && e.target.closest("input[data-id]");
  if(!cb) return;
  var id = cb.getAttribute("data-id");
  if(cb.checked) DONE.add(id); else DONE.delete(id);
  lsSave(); queueRemote(); refresh();
});

/* ---------- TABS ---------- */
var TABS = ["plan","nc","sd","skills"];
function showTab(name){
  if(TABS.indexOf(name) < 0) name = "plan";
  TABS.forEach(function(t){
    document.getElementById("tab-"+t).classList.toggle("on", t===name);
  });
  document.querySelectorAll("#tabs button").forEach(function(b){
    b.setAttribute("aria-selected", b.getAttribute("data-tab")===name ? "true" : "false");
  });
}
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]"); if(!b) return;
  var t = b.getAttribute("data-tab");
  showTab(t);
  try{ history.replaceState(null, "", "#"+t); }catch(err){}
});
window.addEventListener("hashchange", function(){ showTab(location.hash.slice(1)); });

/* Two-step clear, since confirm() is blocked in the viewer */
var resetBtn = document.getElementById("reset"), resetTimer;
resetBtn.addEventListener("click", function(){
  if(resetBtn.getAttribute("data-armed") !== "1"){
    resetBtn.setAttribute("data-armed","1");
    resetBtn.textContent = "Click again to clear everything";
    resetTimer = setTimeout(function(){ resetBtn.removeAttribute("data-armed"); resetBtn.textContent = "Clear all progress"; }, 4000);
    return;
  }
  clearTimeout(resetTimer);
  resetBtn.removeAttribute("data-armed"); resetBtn.textContent = "Clear all progress";
  DONE.clear(); lsSave(); queueRemote(); refresh();
});

/* ---------- BOOT ---------- */
lsLoad();
mount();
showTab(location.hash.slice(1));

(async function connect(){
  try{
    if(!window.claude || !window.claude.use) { setSync("Saved on this device"); return; }
    var user = await window.claude.use("user");
    var db = await window.claude.use("db");
    var uid = user ? await user.id() : null;
    if(!db || !uid){ setSync("Saved on this device"); return; }
    remote.doc = db.doc("data/users/"+uid+"/progress");
    var timer = setTimeout(function(){ setSync("Saved on this device (account sync not reachable yet)"); }, 10000);
    remote.doc.onSnapshot(function(snap){
      if(snap.metadata.fromCache && remote.first) return;
      clearTimeout(timer);
      if(snap.metadata.hasPendingWrites) return;
      var rd = snap.exists ? (snap.data().done || []) : [];
      if(remote.first){
        remote.first = false;
        var before = DONE.size;
        rd.forEach(function(x){ DONE.add(x); });
        lsSave(); refresh();
        if(DONE.size !== rd.length) queueRemote();
        setSync("Saved to your account");
      }else{
        DONE = new Set(rd); lsSave(); refresh();
      }
    }, function(){ clearTimeout(timer); setSync("Saved on this device"); });
  }catch(e){ setSync("Saved on this device"); }
})();

/* ---------- Standalone extras: backup file and storage check ---------- */
(function(){
  var ok = true;
  try{ localStorage.setItem("prep-test","1"); ok = localStorage.getItem("prep-test")==="1"; localStorage.removeItem("prep-test"); }catch(e){ ok = false; }
  if(!window.claude){
    setSync(ok ? "Saved in this browser. Use Export progress now and then as a backup."
               : "This browser is blocking saving, so progress will be lost when you close the page. Use Export progress to keep it.");
  }
  document.getElementById("export").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify({done: Array.from(DONE)}, null, 1)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "prep-progress.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    setSync("Exported prep-progress.json to your downloads folder.");
  });
  var fi = document.getElementById("importFile");
  document.getElementById("import").addEventListener("click", function(){ fi.click(); });
  fi.addEventListener("change", function(){
    var f = fi.files && fi.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result), arr = Array.isArray(d) ? d : d.done;
        if(!Array.isArray(arr)) throw new Error("bad");
        DONE = new Set(arr.filter(function(x){ return typeof x === "string"; }));
        lsSave(); refresh();
        setSync("Imported "+DONE.size+" checked items.");
      }catch(e){ setSync("That file isn't a progress export."); }
      fi.value = "";
    };
    r.readAsText(f);
  });
})();
</script>
